name: deploy

on:
  push:
    branches: [dev, main]     # NIC na pull_request - deploy jest skutkiem merge'a

permissions:
  contents: read
  id-token: write             # token OIDC dla AWS

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # deployu nigdy nie przerywamy

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PREFIX: cloudops
  # main -> prod, wszystko inne -> dev
  TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  ACCOUNT: ${{ github.ref_name == 'main' && vars.PROD_ACCOUNT_ID || vars.DEV_ACCOUNT_ID }}

jobs:

  discover:
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.d.outputs.solutions }}
      count: ${{ steps.d.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml==6.0.2
      - id: d
        run: python3 scripts/discover-solutions.py "${{ github.event.before }}" "${{ github.sha }}"
